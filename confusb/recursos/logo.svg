<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="200,30 340,110 340,290 200,370 60,290 60,110"
           fill="none" stroke="#3fb950" stroke-width="4" opacity="0.55" filter="url(#glow)"/>
  <circle cx="200" cy="160" r="85" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.35"/>
  <circle cx="200" cy="160" r="56" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.25"/>
  <!-- símbolo USB: el pulso entra por la izquierda y se convierte en el tronco del tridente -->
  <g fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="96,160 124,160 138,126 156,194 170,160 262,160"/>
    <polyline points="198,160 220,130 250,130"/>
    <polyline points="224,160 244,188 262,188"/>
  </g>
  <g fill="#3fb950" filter="url(#glow)">
    <polygon points="262,146 288,160 262,174"/>
    <circle cx="260" cy="130" r="9"/>
    <rect x="266" y="179" width="18" height="18" rx="2"/>
  </g>
  <text x="200" y="290" text-anchor="middle"
        font-family="'DejaVu Sans Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace"
        font-size="25" font-weight="700" letter-spacing="1" fill="#e6edf3">CONFUSB</text>
</svg>
